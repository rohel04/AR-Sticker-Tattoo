<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR POC</title>
    <link rel="stylesheet" href="/src/styles/main.css" />

    <!-- Global mobile error catcher -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var extra = !col ? '' : '\\ncolumn: ' + col;
        extra += !error ? '' : '\\nerror: ' + error.stack;
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.background = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.padding = '15px';
        errDiv.style.zIndex = '999999';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = "Global Error: " + msg + "\\nurl: " + url + "\\nline: " + line + extra;
        document.body.appendChild(errDiv);
        return false;
      };

      // Catch module/script resource load failures
      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var errDiv = document.createElement('div');
          errDiv.style.position = 'fixed';
          errDiv.style.top = '50px';
          errDiv.style.left = '0';
          errDiv.style.width = '100%';
          errDiv.style.background = 'rgba(150,0,0,0.9)';
          errDiv.style.color = 'white';
          errDiv.style.padding = '15px';
          errDiv.style.zIndex = '999999';
          errDiv.style.fontFamily = 'monospace';
          errDiv.style.fontSize = '12px';
          errDiv.style.whiteSpace = 'pre-wrap';
          errDiv.innerText = "Resource Load Error: Failed to load " + event.target.tagName + " src: " + (event.target.src || event.target.href);
          document.body.appendChild(errDiv);
        }
      }, true);
      
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.bottom = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.background = 'rgba(255,100,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.padding = '15px';
        errDiv.style.zIndex = '999999';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = "Unhandled Rejection: " + (event.reason ? (event.reason.stack || event.reason) : event);
        document.body.appendChild(errDiv);
      });
    </script>

    <!-- Import map for native ES module resolution in the browser.
         Vendored locally under /vendor (instead of cdn.jsdelivr.net) so the
         app doesn't depend on that CDN being reachable on every network —
         some networks block it, which broke module loading for both engines. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "/vendor/three/examples/jsm/loaders/GLTFLoader.js",
          "three/addons/renderers/CSS3DRenderer.js": "/vendor/three/examples/jsm/renderers/CSS3DRenderer.js",
          "mind-ar-three": "/vendor/mind-ar/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar-container"></div>

    <div id="ui-container">
      <div class="logo">WebAR</div>
      
      <div id="target-status">Target Lost</div>

      <div id="status-panel">
        <p id="status-text">Initializing...</p>
      </div>

      <div class="controls">
        <button id="btn-start">Start AR</button>
      </div>

      <!-- Scanning Guide (shown when target is lost, hidden on found) -->
      <div id="scan-guide">
        <div id="scan-reticle">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div id="scan-line"></div>
        </div>
        <p id="scan-hint">Point at the sticker &amp; move closer</p>
      </div>

      <!-- New Interactive Controls (Hidden until AR starts) -->
      <div id="interactive-ui" style="display: none;">
        <!-- Camera Zoom Row -->
        <div id="cam-zoom-row">
          <span>📷</span>
          <button class="zoom-btn" data-zoom="1">1×</button>
          <button class="zoom-btn active-zoom" data-zoom="2">2×</button>
          <button class="zoom-btn" data-zoom="3">3×</button>
          <button class="zoom-btn" data-zoom="4">4×</button>
        </div>
        <div class="animation-tray" id="controls-container">
          <!-- Animation buttons will be injected here dynamically -->
        </div>
        <div style="text-align: center; margin-top: 10px;">
          <button id="btn-torch" title="Toggle flashlight">🔦 Torch</button>
        </div>
      </div>

      <div id="debug-panel">
        <div>AR initialized: <span id="dbg-ar">false</span></div>
        <div>Camera: <span id="dbg-cam">inactive</span></div>
        <div>Target: <span id="dbg-target">not detected</span></div>
        <div>Model loaded: <span id="dbg-model">false</span></div>
        <div>Pose: <span id="dbg-pose">-</span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
